[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "planner"
version = "0.1.0"
description = "Prototype tools for extracting steel panel takeoff data from vector PDF drawings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.26",
    "shapely>=2.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
optimize = ["ortools>=9.14"]
dev = ["pytest>=8"]

[project.scripts]
planner = "planner.main:main"

[tool.setuptools.packages.find]
where = ["src"]
